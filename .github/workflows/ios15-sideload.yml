name: Build iOS 15 Sideload IPA

on:
  push:
    branches: [ios15]
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: write

concurrency:
  group: ios15-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS 15 ${{ inputs.configuration || 'Release' }} IPA
    runs-on: macos-26
    timeout-minutes: ${{ inputs.configuration == 'Debug' && 45 || 90 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      NUVIO_STRIP_PLUGINS: '1'
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned iOS 15 ${{ inputs.configuration || 'Release' }} IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          set -o pipefail
          ./scripts/build-ios-ipa.sh 2>&1 | tee build.log || {
            grep -E -A2 "(error:|e: |\*\* BUILD FAILED|What went wrong|FAILURE:|Undefined symbol|ld: )" build.log \
              | grep -v -E "^(warning|--$)" | awk '!seen[$0]++' | head -40 > errors.txt || true
            head -c 60000 errors.txt > errors_short.txt
            while IFS= read -r line; do echo "::error::${line:0:900}"; done < <(head -9 errors_short.txt)
            { echo '## Errors'; echo '```'; cat errors_short.txt; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-ios15-ipa
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          cp "${ipa_path}" Nuvio-iOS15.ipa
          tag="ios15-${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" Nuvio-iOS15.ipa --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Nuvio iOS 15 (${tag})" --notes "Unsigned IPA for iOS 15 sideloading." --prerelease
